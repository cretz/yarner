[package]
name = "yarner-engine"
description = "The yarner story graph, LLM contract, generation and playthroughs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Only `sync` without the runtime, so the read-only model builds for wasm.
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = { workspace = true, optional = true }
yarner-format.workspace = true
zeroize.workspace = true

[features]
# The async engine (scheduler, generation). Off for the read-only player (wasm).
default = ["runtime"]
runtime = ["tokio/rt", "tokio/time", "tokio/macros", "dep:tracing"]

[dev-dependencies]
tempfile.workspace = true
