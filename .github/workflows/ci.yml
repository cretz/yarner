name: CI

# Pull requests, and `main` once one merges.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: projects

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The same pin as `projects/rust-toolchain.toml`, so CI denies the lints a developer sees.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects
          cache-on-failure: true
      - run: cargo test --locked

  # The web client (with the wasm read-only player) checked, built, and driven in a real
  # browser against the server with its mock generator, and as a static player.
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects
          cache-on-failure: true
      # Must match the `wasm-bindgen` crate pin in projects/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: projects/yarner-client/pnpm-lock.yaml
      - run: cargo build --locked -p yarner-server
      - working-directory: projects/yarner-client
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build:wasm
          pnpm typecheck
          pnpm lint
          pnpm fmt:check
          pnpm test:e2e
